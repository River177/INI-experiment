seed: 42
project_name: bipia_dpo_grpo

model:
  name_or_path: Qwen/Qwen2.5-0.5B-Instruct
  trust_remote_code: true
  use_4bit: true
  torch_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "down_proj", "gate_proj"]

data:
  bipia_root: data/raw/bipia
  tasks: ["email", "qa", "summarization", "code"]
  train_split: 0.8
  val_split: 0.1
  max_prompt_chars: 6000

train:
  max_length: 1024
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2e-5
  num_train_epochs: 1
  logging_steps: 10
  save_steps: 100
  eval_steps: 100

output:
  root: outputs
